name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/schoolos?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # BL-12: fail on any High/Critical advisory in production dependencies
      - run: npm audit --omit=dev --audit-level=high
      # BL-66: generated docs must match the repository (regenerate: node scripts/docs/generate.mjs)
      - run: node --test ../scripts/docs/lib.test.mjs
      - run: node ../scripts/docs/generate.mjs --check
      - run: cp .env.example .env
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # BL-65: the migration harness creates/drops its own scratch databases (schoolos_scratch_*)
      - run: npm run migration:harness:test
      # Backend carries ~672 pre-existing repo-wide Prettier/CRLF errors (see PROJECT-STATUS.md,
      # "Security Hardening Pass"); a full `prettier --write` is its own change, deliberately out of
      # Sprint A's scope. Non-blocking so the rest of this gate is trustworthy from run #1 — flip
      # to blocking once that backlog is cleared. staff-console's lint stays blocking (it is clean).
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  staff-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staff-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: staff-console/package-lock.json
      - run: npm ci
      # BL-12: fail on any High/Critical advisory in production dependencies
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  parent-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parent-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
