<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assessment Categories</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  .muted{color:#64748b;}
  .card{background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.1);}
  table{border-collapse:separate;border-spacing:0;width:100%;}
  th{padding:10px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;text-align:left;border-bottom:1px solid #e2e8f0;background:#fafbfc;}
  td{padding:10px 16px;border-bottom:1px solid #f1f5f9;font-size:13.5px;}
  tr:last-child td{border-bottom:none;}
  .btn-primary{border:none;background:#0369a1;color:#fff;font:inherit;font-weight:700;font-size:13px;padding:9px 16px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .link{color:#0369a1;font-weight:700;font-size:12.5px;cursor:pointer;margin-right:14px;}
  .link-danger{color:#dc2626;font-weight:700;font-size:12.5px;cursor:pointer;}
  .field-label{font-size:11.5px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:block;}
  .field-input{border:1px solid #cbd5e1;border-radius:6px;padding:8px 12px;font:inherit;font-size:13px;color:#1e293b;background:#fff;}
</style>
</helmet>

<div style="width:900px;height:700px;background:#f8fafc;padding:36px 44px;display:flex;flex-direction:column;gap:16px;">

  <div style="display:flex;align-items:flex-start;justify-content:space-between;">
    <div>
      <h1 style="margin:0 0 4px;font-size:21px;font-weight:800;color:#0f172a;">Assessment Categories</h1>
      <span class="muted" style="font-size:13px;">Grade 6 · Term 1, 2026–27</span>
    </div>
    <button type="button" class="btn-primary">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      Add
    </button>
  </div>

  <div style="display:flex;gap:16px;align-items:flex-end;">
    <div><span class="field-label">Class</span><select class="field-input" style="width:160px;"><option>Grade 6</option><option>Grade 7</option></select></div>
    <div><span class="field-label">Term</span><select class="field-input" style="width:160px;"><option>Term 1</option><option>Term 2</option></select></div>
  </div>

  <div style="background:#fbf0de;border:1px solid #f3d9ab;border-radius:8px;padding:10px 14px;font-size:12.5px;color:#92400e;font-weight:600;">Weights sum to 90% — add 10% more before publishing report cards.</div>

  <div class="card" style="overflow:hidden;">
    <table>
      <thead><tr><th>Name</th><th style="width:120px;">Weight %</th><th style="width:160px;"></th></tr></thead>
      <tbody>
        <tr><td style="font-weight:600;">Quizzes</td><td class="mono">30%</td><td><span class="link">Edit</span><span class="link-danger">Delete</span></td></tr>
        <tr><td style="font-weight:600;">Assignments</td><td class="mono">20%</td><td><span class="link">Edit</span><span class="link-danger">Delete</span></td></tr>
        <tr>
          <td><input class="field-input" value="Mid-term Exam" style="width:100%;"></td>
          <td><input class="field-input" value="40" style="width:70px;"></td>
          <td><span class="link">Save</span><span class="link-danger">Cancel</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
