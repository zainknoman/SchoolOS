<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leave Applications</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  .muted{color:#64748b;}
  .card{background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.1);}
  .pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:700;}
  .btn-secondary{border:1px solid #cbd5e1;background:#fff;color:#334155;font:inherit;font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:6px;cursor:pointer;}
  .btn-danger-outline{border:1px solid #dc2626;background:#fff;color:#dc2626;font:inherit;font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:6px;cursor:pointer;}
  .field-label{font-size:11.5px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:block;}
  .field-input{border:1px solid #cbd5e1;border-radius:6px;padding:8px 12px;font:inherit;font-size:13px;color:#1e293b;background:#fff;}
  .leave-row{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid #f1f5f9;}
  .leave-row:last-child{border-bottom:none;}
</style>
</helmet>

<div style="width:1000px;height:720px;background:#f8fafc;padding:36px 44px;display:flex;flex-direction:column;gap:16px;">

  <div>
    <h1 style="margin:0 0 4px;font-size:21px;font-weight:800;color:#0f172a;">Leave Applications</h1>
    <span class="muted" style="font-size:13px;">Student leave requests</span>
  </div>

  <div><span class="field-label">Status</span><select class="field-input" style="width:180px;"><option>Pending</option><option>Approved</option><option>Rejected</option><option>All</option></select></div>

  <div class="card" style="flex-grow:1;overflow:hidden;">
    <div class="leave-row">
      <div style="flex-grow:1;">
        <div style="font-weight:700;font-size:13.5px;">Zara Ali</div>
        <div class="muted" style="font-size:12.5px;">22 Sep to 24 Sep</div>
        <div class="muted" style="font-size:11.5px;margin-top:2px;">Family wedding out of town</div>
      </div>
      <span class="pill" style="background:#fbf0de;color:#b45309;">pending</span>
      <button type="button" class="btn-secondary">Approve</button>
      <button type="button" class="btn-danger-outline">Reject</button>
    </div>
    <div class="leave-row">
      <div style="flex-grow:1;">
        <div style="font-weight:700;font-size:13.5px;">Bilal Khan</div>
        <div class="muted" style="font-size:12.5px;">18 Sep to 18 Sep</div>
        <div class="muted" style="font-size:11.5px;margin-top:2px;">Doctor's appointment</div>
      </div>
      <span class="pill" style="background:#e4f5ea;color:#15803d;">approved</span>
    </div>
    <div class="leave-row">
      <div style="flex-grow:1;">
        <div style="font-weight:700;font-size:13.5px;">Hania Sheikh</div>
        <div class="muted" style="font-size:12.5px;">10 Sep to 11 Sep</div>
        <div class="muted" style="font-size:11.5px;margin-top:2px;">Travel — no supporting reason given</div>
      </div>
      <span class="pill" style="background:#fce8e7;color:#dc2626;">rejected</span>
    </div>
    <div class="leave-row">
      <div style="flex-grow:1;">
        <div style="font-weight:700;font-size:13.5px;">Danish Iqbal</div>
        <div class="muted" style="font-size:12.5px;">25 Sep to 26 Sep</div>
        <div class="muted" style="font-size:11.5px;margin-top:2px;">Cousin's wedding</div>
      </div>
      <span class="pill" style="background:#fbf0de;color:#b45309;">pending</span>
      <button type="button" class="btn-secondary">Approve</button>
      <button type="button" class="btn-danger-outline">Reject</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
