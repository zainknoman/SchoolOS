<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Holidays</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  .muted{color:#64748b;}
  .card{background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.1);}
  table{border-collapse:separate;border-spacing:0;width:100%;}
  th{padding:10px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;text-align:left;border-bottom:1px solid #e2e8f0;background:#fafbfc;}
  td{padding:10px 16px;border-bottom:1px solid #f1f5f9;font-size:13.5px;}
  tr:last-child td{border-bottom:none;}
  .btn-primary{border:none;background:#0369a1;color:#fff;font:inherit;font-weight:700;font-size:13px;padding:9px 16px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .link{color:#0369a1;font-weight:700;font-size:12.5px;cursor:pointer;margin-right:14px;}
  .link-danger{color:#dc2626;font-weight:700;font-size:12.5px;cursor:pointer;}
</style>
</helmet>

<div style="width:1000px;height:700px;background:#f8fafc;padding:36px 44px;display:flex;flex-direction:column;gap:16px;">

  <div style="display:flex;align-items:flex-start;justify-content:space-between;">
    <div>
      <h1 style="margin:0 0 4px;font-size:21px;font-weight:800;color:#0f172a;">Holidays</h1>
      <span class="muted" style="font-size:13px;">Declared school holidays &amp; breaks</span>
    </div>
    <button type="button" class="btn-primary">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      Add
    </button>
  </div>

  <div class="card" style="flex-grow:1;overflow:hidden;">
    <table>
      <thead><tr><th>Title</th><th style="width:130px;">Start</th><th style="width:130px;">End</th><th>Campus</th><th style="width:150px;"></th></tr></thead>
      <tbody>
        <tr><td style="font-weight:600;">Independence Day</td><td class="mono">14 Sep</td><td class="mono">14 Sep</td><td>Every campus</td><td><span class="link">Edit</span><span class="link-danger">Delete</span></td></tr>
        <tr><td style="font-weight:600;">Eid break</td><td class="mono">16 Jun</td><td class="mono">20 Jun</td><td>Every campus</td><td><span class="link">Edit</span><span class="link-danger">Delete</span></td></tr>
        <tr><td style="font-weight:600;">North Campus sports day</td><td class="mono">3 Nov</td><td class="mono">3 Nov</td><td>North Campus</td><td><span class="link">Edit</span><span class="link-danger">Delete</span></td></tr>
        <tr><td style="font-weight:600;">Winter break</td><td class="mono">20 Dec</td><td class="mono">2 Jan</td><td>Every campus</td><td><span class="link">Edit</span><span class="link-danger">Delete</span></td></tr>
      </tbody>
    </table>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
