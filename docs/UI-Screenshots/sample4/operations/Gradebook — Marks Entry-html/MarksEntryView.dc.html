<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gradebook — Marks Entry</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  .muted{color:#64748b;}
  .card{background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.1);}
  .btn-primary{border:none;background:#0369a1;color:#fff;font:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:6px;cursor:pointer;}
  .field-label{font-size:11.5px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:block;}
  .field-input{border:1px solid #cbd5e1;border-radius:6px;padding:8px 12px;font:inherit;font-size:13px;color:#1e293b;background:#fff;}
  .roster-row{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid #f1f5f9;}
  .roster-row:last-child{border-bottom:none;}
</style>
</helmet>

<div style="width:900px;height:780px;background:#f8fafc;padding:36px 44px;display:flex;flex-direction:column;gap:16px;">

  <div>
    <h1 style="margin:0 0 4px;font-size:21px;font-weight:800;color:#0f172a;">Gradebook</h1>
    <span class="muted" style="font-size:13px;">Enter marks for one assessment at a time</span>
  </div>

  <div class="card" style="padding:18px 22px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;">
    <div><span class="field-label">Section</span><select class="field-input" style="width:190px;"><option>Grade 9 B — Main Campus</option></select></div>
    <div><span class="field-label">Term</span><select class="field-input" style="width:130px;"><option>Term 1</option></select></div>
    <div><span class="field-label">Category</span><select class="field-input" style="width:140px;"><option>Mid-term Exam</option></select></div>
    <div><span class="field-label">Assessment</span><select class="field-input" style="width:220px;"><option>Algebra unit test (max 50)</option></select></div>
  </div>

  <div class="card" style="flex-grow:1;overflow:hidden;display:flex;flex-direction:column;">
    <div style="padding:12px 18px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-weight:700;font-size:13px;">Roster · 29 students</span>
      <span class="muted mono" style="font-size:11.5px;">max 50</span>
    </div>
    <div style="overflow:hidden;">
      <div class="roster-row"><span style="flex-grow:1;font-weight:600;font-size:13px;">Ahmed Baig</span><input class="field-input mono" style="width:70px;text-align:right;" value="42"></div>
      <div class="roster-row"><span style="flex-grow:1;font-weight:600;font-size:13px;">Zara Ali</span><input class="field-input mono" style="width:70px;text-align:right;" value="47"></div>
      <div class="roster-row"><span style="flex-grow:1;font-weight:600;font-size:13px;">Bilal Khan</span><input class="field-input mono" style="width:70px;text-align:right;" value="35"></div>
      <div class="roster-row"><span style="flex-grow:1;font-weight:600;font-size:13px;">Hania Sheikh</span><input class="field-input mono" style="width:70px;text-align:right;" placeholder="—"></div>
      <div class="roster-row"><span style="flex-grow:1;font-weight:600;font-size:13px;">Danish Iqbal</span><input class="field-input mono" style="width:70px;text-align:right;" placeholder="—"></div>
    </div>
  </div>

  <button type="button" class="btn-primary" style="align-self:flex-end;">Save Marks</button>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":780}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
