<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admissions Queue</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  .muted{color:#64748b;}
  .card{background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.1);}
  table{border-collapse:separate;border-spacing:0;width:100%;}
  th{padding:10px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;text-align:left;border-bottom:1px solid #e2e8f0;background:#fafbfc;}
  td{padding:11px 16px;border-bottom:1px solid #f1f5f9;font-size:13.5px;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:700;}
  .btn-primary{border:none;background:#0369a1;color:#fff;font:inherit;font-weight:700;font-size:13px;padding:9px 16px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .field-label{font-size:11.5px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:block;}
  .field-input{border:1px solid #cbd5e1;border-radius:6px;padding:8px 12px;font:inherit;font-size:13px;color:#1e293b;background:#fff;}
  .link{color:#0369a1;font-weight:700;font-size:12.5px;cursor:pointer;}
</style>
</helmet>

<div style="width:1280px;height:760px;background:#f8fafc;padding:36px 44px;display:flex;flex-direction:column;gap:16px;">

  <div style="display:flex;align-items:flex-start;justify-content:space-between;">
    <div>
      <h1 style="margin:0 0 4px;font-size:21px;font-weight:800;color:#0f172a;">Admissions</h1>
      <span class="muted" style="font-size:13px;">Application queue · 2026–27 session</span>
    </div>
    <button type="button" class="btn-primary">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      Add New
    </button>
  </div>

  <!-- filter row -->
  <div style="display:flex;gap:20px;align-items:flex-end;">
    <div>
      <span class="field-label">Academic session</span>
      <select class="field-input" style="width:220px;"><option>2026–27 (active)</option><option>2025–26</option></select>
    </div>
    <div>
      <span class="field-label">Status</span>
      <select class="field-input" style="width:200px;"><option>All statuses</option><option>Submitted</option><option>Under review</option><option>Approved</option><option>Rejected</option><option>Withdrawn</option></select>
    </div>
  </div>

  <div class="card" style="flex-grow:1;overflow:hidden;">
    <table>
      <thead><tr><th>Applicant</th><th>Status</th><th></th></tr></thead>
      <tbody>
        <tr><td style="font-weight:600;">Zainab Farooq</td><td><span class="pill" style="background:#e4f1fa;color:#0369a1;">Under review</span></td><td><span class="link">View</span></td></tr>
        <tr><td style="font-weight:600;">Bilal Ahmed</td><td><span class="pill" style="background:#e8ecf1;color:#334155;">Submitted</span></td><td><span class="link">View</span></td></tr>
        <tr><td style="font-weight:600;">Hania Sheikh</td><td><span class="pill" style="background:#e4f5ea;color:#15803d;">Approved</span></td><td><span class="link">View</span></td></tr>
        <tr><td style="font-weight:600;">Danish Iqbal</td><td><span class="pill" style="background:#fce8e7;color:#dc2626;">Rejected</span></td><td><span class="link">View</span></td></tr>
        <tr><td style="font-weight:600;">Areeba Malik</td><td><span class="pill" style="background:#e8ecf1;color:#334155;">Submitted</span></td><td><span class="link">View</span></td></tr>
        <tr><td style="font-weight:600;">Usman Raza</td><td><span class="pill" style="background:#fbf0de;color:#94a3b8;">Withdrawn</span></td><td><span class="link">View</span></td></tr>
      </tbody>
    </table>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
